server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 121.41.5.179;

    ssl_certificate /etc/letsencrypt/live/admcube-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admcube-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ADM_CUBE_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    if ($host != "121.41.5.179") { return 444; }
    if ($admcube_origin_allowed = 0) { return 403; }

    access_log off;
    error_log /var/log/nginx/admcube-error.log warn;

    client_max_body_size 1m;
    limit_req zone=admcube_requests burst=50 nodelay;
    limit_conn admcube_connections 20;
    limit_req_status 429;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' data:; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;

    location = /_admcube_auth {
        internal;
        proxy_pass http://127.0.0.1:19081/check;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-ADM-Cube-Client-IP $remote_addr;
        proxy_set_header X-Original-URI $request_uri;
    }

    location = /login {
        client_max_body_size 4k;
        limit_req zone=admcube_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:19081/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-ADM-Cube-Client-IP $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_set_header Referer $http_referer;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_cache off;
        sub_filter 'src="/gongan.png"' 'src="/static/gongan.png"';
        sub_filter_once on;
    }

    location = /logout {
        client_max_body_size 4k;
        limit_req zone=admcube_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:19081/logout;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-ADM-Cube-Client-IP $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_set_header Referer $http_referer;
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_cache off;
    }

    location = /login.css {
        proxy_pass http://127.0.0.1:19081/login.css;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-ADM-Cube-Client-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_cache off;
    }

    location = /login-logo.png {
        proxy_pass http://127.0.0.1:19081/login-logo.png;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-ADM-Cube-Client-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_cache off;
    }

    location = /gongan.png {
        proxy_pass http://127.0.0.1:19080/static/gongan.png;
        proxy_set_header Host 127.0.0.1:38888;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_cache off;
    }

    location = /favicon.ico {
        proxy_pass http://127.0.0.1:19080/favicon.ico;
        proxy_set_header Host 127.0.0.1:38888;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_cache off;
    }

    location = /static/logo.png {
        proxy_pass http://127.0.0.1:19080/static/logo.png;
        proxy_set_header Host 127.0.0.1:38888;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_cache off;
    }

    location = /static/gongan.png {
        proxy_pass http://127.0.0.1:19080/static/gongan.png;
        proxy_set_header Host 127.0.0.1:38888;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_cache off;
    }

    location / {
        auth_request /_admcube_auth;
        auth_request_set $admcube_login_location $upstream_http_x_login_location;
        error_page 401 = @login_required;

        proxy_pass http://127.0.0.1:19080;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:38888;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $admcube_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_cache off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location @login_required {
        return 302 $admcube_login_location;
    }

    error_page 500 502 504 = @service_unavailable;
    location @service_unavailable {
        default_type application/json;
        return 503 '{"detail":"ADM-Cube is temporarily unavailable"}';
    }
}
