limit_req_zone $binary_remote_addr zone=admcube_requests:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=admcube_login:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=admcube_connections:10m;
map $http_upgrade $admcube_connection_upgrade {
    default upgrade;
    '' close;
}
map "$request_method:$http_origin" $admcube_method_origin_allowed {
    default 0;
    ~^(GET|HEAD|OPTIONS): 1;
    "POST:https://121.41.5.179" 1;
    "PUT:https://121.41.5.179" 1;
    "DELETE:https://121.41.5.179" 1;
    "POST:https://admcubequant.tj.cn" 1;
    "PUT:https://admcubequant.tj.cn" 1;
    "DELETE:https://admcubequant.tj.cn" 1;
}
map "$request_method:$http_origin:$http_referer" $admcube_missing_origin_referer_allowed {
    default 0;
    ~^(POST|PUT|DELETE)::https://121\.41\.5\.179(?:[/?]|$) 1;
    ~^(POST|PUT|DELETE)::https://admcubequant\.tj\.cn(?:[/?]|$) 1;
}
map "$admcube_method_origin_allowed:$admcube_missing_origin_referer_allowed" $admcube_origin_allowed {
    default 0;
    ~^1: 1;
    "0:1" 1;
}
